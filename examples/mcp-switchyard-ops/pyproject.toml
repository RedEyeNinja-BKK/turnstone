[build-system]
requires = ["hatchling>=1.29"]
build-backend = "hatchling.build"

[project]
name = "mcp-switchyard-ops"
version = "0.1.0"
description = "Typed MCP tools for the read-only Switchyard runtime."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "mcp>=1.6",
]

[project.scripts]
mcp-switchyard-ops = "mcp_switchyard_ops.server:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

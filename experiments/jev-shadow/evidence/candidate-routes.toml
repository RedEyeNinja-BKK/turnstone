# ORNITH 2026-09-19 (operator GO): Ornith-1.5-9B-MTP IQ4_XS supplements Qwen on
# HTPC. One client per target, same family convention. Front :8889 resolves the
# alias and switches the resident per request (~7-12 s switch cost).
# 2026-09-19 operator ruling (option (a): mirror the ComfyNinja client shape) — the clients
# now carry the `llama_cpp_enable_thinking` dialect, the same dialect the sibling
# `htpc-qwen3_5-9b-mtp` client uses on this backend. The dialect makes the reasoning-policy
# mechanism AVAILABLE and translatable; it is INERT while no route declares a
# `reasoning_policy` — these routes stay neutral (no policy) and the no-think default comes
# from the HTPC front profile's enable_thinking pin.

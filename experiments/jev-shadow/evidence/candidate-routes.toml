# ─── OPENROUTER BLOCK A (2026-08-27, operator GO) ──────────────────────
# qwen/qwen3.8-flash added + thinking/NT qualification of both flash models:
#  - GLM-5.3-flash: reasoning MANDATORY upstream (NT attempt -> 400 "Reasoning is
#    mandatory"). effort modulates reasoning tokens. => thinking lane only;
#    deliberately NO -non-thinking route (dead config that would 400).
#  - Qwen3.8-flash: default (no reasoning object) = thinking-ON with runaway burn
#    (700-900 r_tokens, finish=length, EMPTY content). NT toggle proven (0.6s,
#    finish=stop). Thinking effort=low proven. => BOTH lanes; each target PINS its
#    reasoning body — never rely on caller defaults.
# Economics (OpenRouter live 2026-08-27, re-verified 2026-08-28): GLM $0.075/$0.25 per M (50% ZAI promo
# expires 2026-09-09 -> $0.15/$0.50), cache read $0.015, ctx 1310720.
# Qwen-flash $0.15/$0.47 per M, cache read $0.016 / write $0.20, ctx 1000000.
# Soft-privacy posture (see header above) applies to the qwen lanes equally.
# 2026-09-15 STAGE-2 RESPONSES CUTOVER (operator GO): OpenRouter client moved
# openai_chat -> openai_responses. Parity live-probed 2026-09-15: tools + tool loop,
# temperature, max_output_tokens, streaming (data-only SSE frames, JSON `type`
# dispatch), and the `reasoning = { enabled = false }` NT pin (rt=0). GLM keeps NO
# NT pin: OpenRouter answers 400 "Reasoning is mandatory for this endpoint" when
# reasoning is disabled for z-ai/glm-5.3-flash. `strip_reasoning_content` is
# re-armed on this wire by strip_input_reasoning_items (binary 5890c7b7…, commit
# b10e1750): replayed CoT travels as input[] `reasoning` items and is now removed
# there too. Rollback: routes.toml.bak-20260915-pre-openrouter-responses-apply.
[llm_clients.openrouter-qwen3_8-flash]
format = "openai_responses"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

# Lane targets carry per-lane reasoning pins via extra_body. Targets sharing an
# upstream model id MUST live on separate llm_clients (targets key by client+id;
# same-id targets on one client collapse and drop their extra_body).
# 2026-09-15 STAGE-2 RESPONSES CUTOVER (operator GO): OpenRouter client moved

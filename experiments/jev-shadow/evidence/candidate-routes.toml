reasoning_dialect = "openai_effort"
reasoning_efforts = ["none", "low", "high", "max"]
# 2026-09-15 STAGE-1 RESPONSES CUTOVER (operator GO): openai_chat -> openai_responses.
# DeepSeek /responses live-verified 2026-09-15: effort=none works (0 reasoning tokens),
# reasoning-item replay accepted, tool loop round-trips, stream ends response.completed
# (no [DONE] — the Responses codec is event-driven, no dependency), store=false tolerated.
# Wire-level evidence pack: project memory switchyard_responses_migration_evidence_2026_09_15.
# Rollback: restore routes.toml.bak-20260915-pre-responses-stage1 (sha 01b4669f…) + restart.



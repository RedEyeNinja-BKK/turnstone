# 2026-09-18 OPERATOR RULING — candidate order is an OPERATIONAL POSTURE, not a
# reaction to current headroom. Luna is rank 1; OpenRouter Qwen 3.7 is rank 2;
# DeepSeek Flash is rank 3.
# Temporary OpenAI weekly-allowance exhaustion is handled by READINESS, which is what
# the readiness plane is FOR: while the allowance gate says Luna cannot serve,
# FleetRouter selects rank 2; when the allowance returns, Luna resumes rank 1 with NO
# config edit. Encoding temporary exhaustion into long-term preference order would be
# wrong, and rank 3 is not a preference change either.
# RANK 3 IS AN INDEPENDENT-PROVIDER ESCAPE HATCH (added 2026-09-18 after the bounded
# fleet was observed to collapse onto rank 2 alone and rate-limit: six clustered 429s
# in one minute). Its purpose is provider/rate-limit DIVERSITY, which is why it is
# DeepSeek and not another OpenRouter model, and it serves ONLY when BOTH higher-ranked
# candidates are ineligible — it does not make DeepSeek a preferred bounded model.
[[routes.switchyard-smart-bounded-turnstone.candidates]]
target = "openai-gpt-6-luna"
tool_calling = true
reasoning = true
supports_vision = true
preference_rank = 1
usable_context_tokens = 266000

[[routes.switchyard-smart-bounded-turnstone.candidates]]
target = "openrouter-qwen3_7-flash"
tool_calling = true
reasoning = true
supports_vision = true
preference_rank = 2
usable_context_tokens = 1000000


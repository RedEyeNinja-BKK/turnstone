# LFM remains a separately qualified FREE PASSTHROUGH route on the LLM side:
#   routes.sw-openrouter-liquid-lfm-2_5-2_6b-free -> targets.openrouter-liquid-lfm-2_5-2_6b-free
#   -> llm_clients.openrouter-liquid-lfm-2_5-2_6b-free
# It is NOT a decision-capability backend and NOT part of any Span failover
# chain. The former decision adapter that carried it has been removed: it had
# zero wiring and zero lifetime traffic, and its "fallback" name implied a
# relationship to Span that never existed in the config.
#
# ---------------------------------------------------------------------------
# Decision-capability provider topology (converged 2026-09-30)
#
# Span (respan/span-01-lite) and HTPC Laya are QUALIFIED PEER PROVIDERS with
# different coverage, not a primary/secondary hierarchy. Coverage:
#
#   shared 5 signals   task_complexity, reasoning_demand, tool_dependency,
#                      agentic_complexity, route_sufficiency
#   local_suitability  Span only. Laya does not provide it, and it is never
#                      fabricated, inferred or carried forward.
#
# `fallback_target` below expresses R1/R2 EXECUTION ORDER for a resilient lane.
# It is not a quality ranking.
#
# "smartfree" is a stable compatibility/logical alias. It is NOT a guarantee that
# an upstream provider stays zero-cost; the OpenRouter routes behind these names
# are priced at the provider's current discretion.
# ---------------------------------------------------------------------------

# Fallback executor: HTPC Laya, a typed-decision backend on its own path.
[capability_clients.htpc-laya-decision]
format = "openrouter_alpha_decisions"
base_url = "http://100.105.20.36:8011"
model = "laya-rl-agent"
endpoint_path = "/v1/systemone"
api_key_env = "LOCALCLAW_LAYA_API_KEY"
timeout_seconds = 30

# A. PRIMARY resilient lane — Span R1 with a one-hop Laya R2.
#    This is the lane every consumer calls: the Turnstone shadow sensor
#    (DECISION_CAPABILITY) and the Output Guard
#    (judge.output_guard_model = switchyard-smart-aux-turnstone).
#    R1 is attempted first; R2 runs only if R1 fails. The attempt order is
#    EXECUTION TOPOLOGY, not a quality ranking: Span and HTPC Laya are
#    qualified PEER providers with different coverage, not a hierarchy.
[capabilities.switchyard-smart-aux-turnstone]
id = "switchyard-smart-aux-turnstone"
target = "openrouter-respan-span-01-lite"
decision_contract = "switchyard-decision:v1"
max_questions = 16
max_state_chars = 65536
fallback_target = "switchyard-smartlocal-aux-turnstone"

# B. Laya-only direct lane. No Span leg, ever.
#    For direct local operation, provider comparison and diagnostics.
#    Provides the shared 5 signals; local_suitability is unavailable by design.
[capabilities.switchyard-smartlocal-aux-turnstone]
id = "switchyard-smartlocal-aux-turnstone"
target = "htpc-laya-decision"
decision_contract = "switchyard-decision:v1"
max_questions = 16
max_state_chars = 65536

# C. Span-only lane. NO fallback leg by design: this is the direct Span lane,
#    kept for provider comparison and diagnostics against the resilient
#    `switchyard-smart-aux-turnstone` lane, which shares the same R1 client.
#    If Span is unavailable this lane is DEAD (HTTP 502) -- that is its purpose.
[capabilities.switchyard-smartfree-aux-turnstone]
id = "switchyard-smartfree-aux-turnstone"
target = "openrouter-respan-span-01-lite"
decision_contract = "switchyard-decision:v1"
max_questions = 16
max_state_chars = 65536

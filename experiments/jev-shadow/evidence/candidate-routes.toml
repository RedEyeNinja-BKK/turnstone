# LOCALCLAW SWITCHYARD — PRODUCTION ROUTING CONFIG (:4000)
# Generated 2026-08-22 as part of Switchyard S2-H production-lineage reconciliation;
# CUT OVER TO PRODUCTION 2026-08-22 (checkpoint-switchyard-s2h-cutover-deployed).
# Translates the 9 `resource_router` (smart*) routes onto `fleet_router`, retires
# `[resource_pools.*]` + `[comfyninja]` (see worksheet S2H_RECONCILIATION_WORKSHEET.md),
# and preserves all passthrough + stage_router caller surfaces.
#
# Header corrected 2026-08-26 (Gate D3): the file IS the live production config.
# Comment-only change; routing entries untouched.
# Resource-gated readiness (OpenAI weekly / DeepSeek balance) is NOT expressed in
# this config: it is produced at runtime by the FleetReadinessMonitor +
# ResourceStateFactsClient (fleet_readiness.rs) writing into the same
# SharedFleetState the FleetRouter server consumes (see PR #10 runtime-owner seam).
# Per the accepted S2-E doctrine, cloud candidates are `unmanaged` for preflight
# context admission (the old chars/4 estimator and 266K routing cap are NOT
# resurrected for parity).

schema_version = 1

# ─── ESCALATION THRESHOLD RAISE v9 (2026-09-12, operator GO) ───────────────
# `switchyard-smart-agentic-<agent>` escalation_max_input_tokens: 81920 -> 163840
# (~16% -> ~31% of the routes' then-524288 window; that window is 266000 since
# 2026-09-18, so the threshold is ~62% of it). The agentic tiers now carry
# substantially more context on their cheap NT lane before handing off to the
# thinking parent. The 4 `switchyard-smartlocal-*` routes are at 61440 since
# 2026-09-18 (operator ruling): a deliberate reduction, not the lane's ceiling. — their
# The 4 `switchyard-smartlocal-bounded-*` routes share that trigger and overflow to the
# ComfyNinja q3-MTP lane `sw-comfyninja-qwen3_8-27b-q3-mtp-vl`. That lane is NEUTRAL:
# each escalating route declares `escalation_reasoning_policy`, so the bounded tier
# overflows non-thinking (`none`) and the plain tier overflows at `medium`.
# Rollback: routes.toml.bak-20260912-pre-esc-v9.
# ─────────────────────────────────────────────────────────────────────────

# ThaiLLM migrated to the Responses wire 2026-09-15 (operator GO): live-verified upstream
#   (200 Responses object, SSE with event:+data: frames, store:false tolerated, and tool CALLS
#   work on that surface). tool_calling stays FALSE on these routes: turning it on is a separate
#   capability decision, not part of the wire migration.

# ─── ALIGNMENT REFACTOR v8 (2026-09-12, operator GO) ───────────────────────
# Enforces one traceable name chain across the three namespaces:
#     route  `sw-<X>`   ->   target  `<X>`   ->   llm_client  `<X>`
# (1) orphan targets `unsloth-qwen3_8-27b` / `-nt` and their clients removed;
# (2) one llm_client per target, keyed identically (kills the duplicate
#     upstream-id-within-one-client collapse warning for comfyninja q3/q4);
# (3) targets renamed to mirror their route key:
#       sy-gw-gpt-5_6-{luna,sol,terra}[-nt] -> openai-gpt-5_6-{luna,sol,terra}[-nt]
#       thaillm-openthaigpt-8b-instruct      -> thaillm-openthaigpt
#       thaillm-pathumma-qwen3-8b-think      -> thaillm-pathumma
#       thaillm-typhoon-s-8b                 -> thaillm-typhoon
#       thaillm-thalle-0_2-8b-fa             -> thaillm-thalle
#       + new target htpc-qwen3_5-9b (splits the two htpc routes off one target);
# (4) capability clients mirror their capability key the same way.
# PUBLIC ROUTE IDS ARE UNCHANGED -- route keys/ids, candidates, escalations,
# fleet_readiness and every credential reference are untouched.
# Rollback: routes.toml.bak-20260912-pre-align-v8 (or .align-v8-20260912-deployed).
# ─────────────────────────────────────────────────────────────────────────

# ─── DeepSeek (existing) ──────────────────────────────────────────────
[llm_clients.deepseek-deepseek-flash]
format = "openai_responses"
base_url = "https://api.deepseek.com"
api_key_env = "LOCALCLAW_DEEPSEEK_API_KEY"
# 2026-09-17 GATE 3 (operator GO): route-authoritative reasoning declarations.
